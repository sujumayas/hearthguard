# Exports the web build with Godot and deploys it to Netlify on every push
# to main. Netlify can't run Godot itself, so the build happens here.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   NETLIFY_AUTH_TOKEN  a personal access token from Netlify (User settings > Applications)
#   NETLIFY_SITE_ID     the project ID of kingsfoil-hearthguard
name: Deploy web build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and its web templates
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot/templates
          curl -sSLo /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          # The templates archive is 1.3 GB; only the web ones are kept.
          curl -sSLo /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz "templates/web_*" "templates/version.txt" -d ~/godot/templates
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Install the templates
        run: |
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          cp ~/godot/templates/* "$dest"/

      - name: Export
        run: |
          ~/godot/godot --headless --path . --import || true
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.wasm
          cp deploy/netlify.toml build/web/

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID is not set, so the build was not deployed."
            exit 0
          fi
          npx -y netlify-cli deploy --dir=build/web --prod --no-build --message "${GITHUB_SHA::7}"
